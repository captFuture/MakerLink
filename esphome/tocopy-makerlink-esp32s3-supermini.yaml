# MakerLink Reader: ESP32-S3 Super Mini + PN532 (HSU) + LCD 16x2 und/oder OLED 128x32
# Beide Displays sind einkompiliert (je ein eigener I2C-Bus), es steckt, was gebaut wurde.
# Details zur Hardware: common/esp32s3-supermini.yaml, common/esp32s3-pn532-hsu.yaml, Displays: common/display-dual.yaml

substitutions:
  devicename: makerlink-0815
  friendly_name: MakerLink ESP32-S3 Supermini
  # display_i2c_address: "0x3F"   # LCD, Standard 0x27
  # oled_i2c_address: "0x3D"      # OLED, Standard 0x3C

esphome:
  name: ${devicename}

packages:
  base: !include common/makerlink-reader-base.yaml
  board: !include common/esp32s3-supermini.yaml
  hardware: !include common/esp32s3-pn532-hsu.yaml
  display: !include common/display-dual.yaml
