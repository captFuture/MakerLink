# MakerLink Reader: ESP8266 D1 Mini + RC522 (SPI) + LCD 16x2 (PCF8574)
# Übergangsvariante für bestehende Reader-Hardware: gleiche Pins wie die
# bisherige Firmware, aber ohne Business-Logik.

substitutions:
  devicename: 9997-makerlink-reader
  friendly_name: 9997 DEMO MakerLink Reader Wemos
  p_relay: GPIO16
  p_sda: GPIO4
  p_scl: GPIO5
  p_rfid_rst: GPIO0
  p_rfid_ss: GPIO15

esphome:
  name: ${devicename}
  
packages:
  base: !include common/makerlink-reader-base.yaml
  display: !include common/display-lcd1602.yaml

esp8266:
  board: d1_mini

i2c:
  sda: ${p_sda}
  scl: ${p_scl}
  frequency: 100kHz

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

rc522_spi:
  cs_pin: ${p_rfid_ss}
  reset_pin: ${p_rfid_rst}
  update_interval: 1s
  on_tag:
    then:
      - script.execute:
          id: card_scanned
          uid: !lambda "return x;"

switch:
  - platform: gpio
    id: relay
    name: "Relais"
    pin: ${p_relay}
    restore_mode: ALWAYS_OFF
