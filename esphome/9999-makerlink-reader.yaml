# MakerLink Reader: XIAO ESP32-S3 + PN532 (HSU) + LCD 16x2 und/oder OLED 128x32
# Beide Displays sind einkompiliert (je ein eigener I2C-Bus), es steckt, was gebaut wurde.
# Details zur Hardware: common/esp32s3-xiao.yaml, common/esp32s3-pn532-hsu.yaml, Displays: common/display-dual.yaml
  
substitutions:
  devicename: makerlink-9999
  friendly_name: 9999 DEMO MakerLink Reader XIAO ESP32-S3

esphome:
  name: ${devicename}
  
packages:
  base: !include common/makerlink-reader-base.yaml
  board: !include common/esp32s3-xiao.yaml
  hardware: !include common/esp32s3-pn532-hsu.yaml
  display: !include common/display-dual.yaml
