# MakerLink Reader – gemeinsame Basis ("dummer" Reader)
# Keine Business-Logik: Karten-UID → HA-Event, Display ← 2 Text-Entitäten.
# Dazu kommen ein Hardware-Paket (i2c, Kartenleser → script card_scanned,
# optional Relais/Schalter) und ein Display-Paket (common/display-*.yaml).

substitutions:
  # Für die Display-Pakete: Verbindung zu Home Assistant (WLAN + ESPHome-API).
  link_connected: "id(api_server).is_connected()"
  link_offline_text: "HA offline"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  project:
    # Wird von der MakerLink-Integration für die Auto-Discovery erkannt.
    name: makeraustria.makerlink_reader
    version: "0.4.1"

logger:

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret wifi_ssid1
      password: !secret wifi_password1
      priority: 5
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
      priority: 0
  ap:
    ssid: "${devicename}-setup"

captive_portal:

globals:
  # Lokales Scan-Feedback: Das Display zeigt sofort "Karte erkannt", bis neue Texte
  # kommen (Integration) oder nach 4 s. Siehe common/display-*.yaml.
  - id: g_scan_pending
    type: bool
    initial_value: "false"
  - id: g_scan_ms
    type: uint32_t
    initial_value: "0"

script:
  - id: card_scanned
    mode: single
    parameters:
      uid: string
    then:
      # Sofort lokal anzeigen, dass die Karte gelesen wurde (Antwort aus HA folgt).
      - lambda: |-
          id(g_scan_ms) = millis();
          id(g_scan_pending) = true;
      # Event statt tag_scanned: Mitgliedskarten landen nicht in der HA-Tag-Registry.
      - homeassistant.event:
          event: esphome.makerlink_tag
          data:
            uid: !lambda "return uid;"
      - delay: 1s  # entprellt Mehrfachlesungen derselben Karte

text:
  - platform: template
    id: line1
    name: "Display Zeile 1"
    mode: text
    optimistic: true
    max_length: 16
    initial_value: "-MakerAustria-"
    on_value:
      # Neue Texte aus HA beenden das lokale Scan-Feedback.
      - lambda: "id(g_scan_pending) = false;"
  - platform: template
    id: line2
    name: "Display Zeile 2"
    mode: text
    optimistic: true
    max_length: 16
    initial_value: "Verbinde..."
    on_value:
      # Neue Texte aus HA beenden das lokale Scan-Feedback.
      - lambda: "id(g_scan_pending) = false;"

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic
