# Hardware: Seeed XIAO ESP32-S3 + PN532 (HSU/UART) + Relais + 2 Sicherheitsschalter
# https://www.espboards.dev/esp32/xiao-esp32s3/ (Pinout: docs/layouts/esp32s3-xiao.png)
# Das Display kommt aus einem eigenen Paket (display-*.yaml).
#
# XIAO-Belegung (gleiche D-Pins wie die XIAO-ESP32-C5-Variante):
#   D1 = Relais | D4/D5 = I2C (Display) | D6/D7 = PN532 HSU | D8/D9 = Schalter
#   D2/D3 (Strapping) und D0/D10 bleiben frei.
#   D1 passt zum Seeed "Relay Add-on Module for XIAO" (wiki.seeedstudio.com/relay_add_on_module_for_xiao).
#
# Der PN532 läuft über HSU (UART), NICHT über I2C: Der ESP32 kommt mit dem
# Clock-Stretching des PN532 nicht zurecht. ESPHome hat keine eigene
# PN532-UART-Komponente, deshalb wird pn532_hsu.h eingebunden.
# PN532-Modul auf HSU stellen: Schalter/Jumper I0 = 0, I1 = 0.

substitutions:
  p_relay:    GPIO2    # D1 (Seeed Relay Add-on for XIAO schaltet über D1; NICHT GPIO0 = BOOT-Pin)
  p_sda:      GPIO5    # D4 / SDA
  p_scl:      GPIO6    # D5 / SCL
  p_pn532_rx: "44"     # D7 / RX  (ESP RX ← PN532 TX)
  p_pn532_tx: "43"     # D6 / TX  (ESP TX → PN532 RX)
  p_input1:   GPIO7    # D8  Sicherheitsschalter 1 (zB Kiln-Tür)
  p_input2:   GPIO8    # D9  Sicherheitsschalter 2
  i2c_frequency: 50kHz

  # verdrahtet
  # p_relay:    GPIO6
  # p_sda:      GPIO8
  # p_scl:      GPIO9
  # p_pn532_rx: "4"    # HSU RX  (ESP RX ← PN532 TX)
  #p_pn532_tx: "5"    # HSU TX  (ESP TX → PN532 RX)
  # p_input1:   GPIO10 # Sicherheitsschalter 1 (zB Kiln-Tür)
  #p_input2:   GPIO11 # Sicherheitsschalter 2
  # i2c_frequency: 50kHz

esphome:
  includes:
    # Pfad relativ zum ESPHome-Config-Ordner (siehe esphome/README.md).
    - makerlink/pn532_hsu.h

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: arduino   # pn532_hsu.h nutzt HardwareSerial
  flash_size: 8MB

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # Log über USB, damit GPIO43/44 (UART0) frei für den PN532 sind.
  hardware_uart: USB_SERIAL_JTAG

i2c:
  sda: ${p_sda}
  scl: ${p_scl}
  scan: true
  frequency: ${i2c_frequency}

globals:
  - id: g_pn532_ready
    type: bool
    initial_value: "false"

interval:
  - interval: 1s
    then:
      - lambda: |-
          // PN532 initialisieren (bei Fehler jede Sekunde neu versuchen)
          static PN532_HSU pn532(1, ${p_pn532_rx}, ${p_pn532_tx});
          static std::string last_tag = "";
          static uint8_t misses = 0;
          if (!pn532.ready) {
            pn532.begin();
            id(g_pn532_ready) = pn532.ready;
            if (!pn532.ready) return;
          }

          std::string tag = pn532.read_tag();   // "F4-96-D2-28" oder ""
          if (tag.empty()) {
            // Erst nach 2 leeren Lesungen gilt die Karte als entfernt
            // (entprellt einzelne Lesefehler).
            if (misses < 2) misses++;
            else last_tag = "";
            return;
          }
          misses = 0;
          if (tag == last_tag) return;   // Karte liegt noch auf: nur einmal melden
          last_tag = tag;

          // Rohe UID senden; die Integration wandelt ins MARS-Format um.
          ESP_LOGI("rfid", "Tag PN532='%s'", tag.c_str());
          id(card_scanned).execute(tag);

switch:
  - platform: gpio
    id: relay
    name: "Relais"
    pin: ${p_relay}
    # Nach einem Reboot immer aus; die Integration entscheidet über den Zustand.
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: template
    name: "PN532 bereit"
    entity_category: diagnostic
    device_class: connectivity
    lambda: "return id(g_pn532_ready);"
  # Schalter gegen GND, interner Pull-up: geschlossen = LOW = "off" (zu), offen = "on".
  - platform: gpio
    name: "Sicherheitsschalter 1"
    device_class: door
    pin:
      number: ${p_input1}
      mode: INPUT_PULLUP
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  - platform: gpio
    name: "Sicherheitsschalter 2"
    device_class: door
    pin:
      number: ${p_input2}
      mode: INPUT_PULLUP
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
