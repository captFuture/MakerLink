# Displays: LCD 16x2 (PCF8574) UND OLED 128x32 (SSD1306), beide immer einkompiliert.
# Es steckt, was gebaut wurde; das fehlende Display bleibt einfach dunkel. Dadurch
# braucht ein Wechsel zwischen LCD und OLED kein Neu-Flashen.
#
# Zwei getrennte I2C-Busse (deklariert im Hardware-Paket), weil das LCD (5 V) und das OLED (3,3 V)
# verschiedene Pegel und Geschwindigkeiten brauchen:
#   OLED-Bus  3,3 V, 400 kHz (512 Byte pro Bild, soll die Hauptschleife kaum blockieren)
#   LCD-Bus   50 kHz, Backpack mit 5 V: SDA/SCL über einen Pegelwandler (BSS138) an den ESP
#
# Zeigt die zwei Text-Entitäten line1/line2. Erwartet die Substitutions
# link_connected / link_offline_text (aus der Basis bzw. dem Zigbee-Hardware-Paket)
# und die Globals g_scan_pending / g_scan_ms (Scan-Feedback "Karte erkannt").
# OLED: 16 Zeichen pro Zeile wie beim LCD: Roboto Mono 12 px (~7,2 px Zeichenbreite,
# 16 Zeichen ≈ 115 px), zwei Zeilen à 16 px Höhe inklusive Unterlängen.

substitutions:
  display_i2c_address: "0x27"   # LCD, manche Backpacks: 0x3F
  oled_i2c_address: "0x3C"      # OLED, manche Module: 0x3D

font:
  - file: "gfonts://Roboto Mono"
    id: font_line
    size: 12
    glyphsets:
      - GF_Latin_Kernel

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: ${i2c_oled_id}
    model: "SSD1306 128x32"
    address: ${oled_i2c_address}
    update_interval: 500ms
    lambda: |-
      if (!(${link_connected})) {
        it.print(0, 0, id(font_line), "-MakerAustria-");
        it.print(0, 16, id(font_line), "${link_offline_text}");
        return;
      }
      if (id(g_scan_pending) && millis() - id(g_scan_ms) < 4000) {
        it.print(0, 0, id(font_line), "Karte erkannt");
        it.print(0, 16, id(font_line), "Bitte warten...");
        return;
      }
      it.print(0, 0, id(font_line), id(line1).state.c_str());
      it.print(0, 16, id(font_line), id(line2).state.c_str());
  - platform: lcd_pcf8574
    id: lcd
    i2c_id: ${i2c_lcd_id}
    dimensions: 16x2
    address: ${display_i2c_address}
    update_interval: 250ms
    lambda: |-
      if (!(${link_connected})) {
        it.print(0, 0, "-MakerAustria-");
        it.print(0, 1, "${link_offline_text}");
        return;
      }
      if (id(g_scan_pending) && millis() - id(g_scan_ms) < 4000) {
        it.print(0, 0, "Karte erkannt");
        it.print(0, 1, "Bitte warten...");
        return;
      }
      it.print(0, 0, id(line1).state.c_str());
      it.print(0, 1, id(line2).state.c_str());
